{% extends 'base.html' %}{% block title %}{{ 'Edit' if product else 'Add' }} product · QuickCart{% endblock %}{% block content %}<div class="pagehead"><div><div class="eyebrow">PRODUCT MANAGEMENT</div><h1>{{ 'Edit product' if product else 'Add a product' }}</h1><p class="muted">Changes are saved directly to the database.</p></div><a class="secondary" href="{{ url_for('products') }}">← Back to products</a></div><div class="panel form-panel"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Product name</label><input name="name" maxlength="150" value="{{ product.name if product else '' }}" required><label>Description</label><textarea name="description" rows="3">{{ product.description if product else '' }}</textarea><div class="formgrid"><div><label>Category</label><select name="category_id"><option value="">Uncategorized</option>{% for c in categories %}<option value="{{ c.id }}" {% if product and product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div><label>Price (PHP)</label><input type="number" name="price" min="0" step="0.01" value="{{ product.price if product else '0.00' }}" required></div><div><label>Stock quantity</label><input type="number" name="stock" min="0" step="1" value="{{ product.stock if product else '0' }}" required></div></div><button class="primary">{{ 'Save changes' if product else 'Create product' }}</button></form></div>{% endblock %}
